<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom PDF & Print Maker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Dancing+Script&family=Poppins:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Oswald:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=PT+Sans:wght@400;700&family=Ubuntu:wght@400;700&family=Source+Sans+3:wght@400;700&family=Noto+Sans:wght@400;700&family=Mulish:wght@400;700&family=Quicksand:wght@400;700&family=Josefin+Sans:wght@400;700&family=Fira+Sans:wght@400;700&family=Exo+2:wght@400;700&family=Barlow:wght@400;700&family=Inter:wght@400;700&family=DM+Sans:wght@400;700&family=Work+Sans:wght@400;700&family=Cabin:wght@400;700&family=Karla:wght@400;700&family=Rubik:wght@400;700&family=Jost:wght@400;700&family=Manrope:wght@400;700&family=Pacifico&family=Lobster&family=Comfortaa:wght@400;700&family=Righteous&family=Caveat:wght@400;700&family=JetBrains+Mono:wght@600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59, 130, 246, 0.18), transparent),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(139, 92, 246, 0.18), transparent);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    nav {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    nav a {
      text-decoration: none;
      color: #93c5fd;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 9px 20px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 50px;
      background: rgba(59, 130, 246, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    nav a:hover,
    nav a.on {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.7);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.25);
      color: white;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .divider {
      width: 1px;
      height: 30px;
      background: var(--border);
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 9px 15px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.22s;
      white-space: nowrap;
    }

    .btn-default {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.35);
    }

    .btn-default:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.65);
      transform: translateY(-1px);
    }

    .btn-add {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }

    .btn-add:hover {
      opacity: 0.88;
      transform: translateY(-2px);
    }

    .btn-pdf {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .btn-pdf:hover {
      background: rgba(16, 185, 129, 0.3);
      border-color: rgba(16, 185, 129, 0.65);
      transform: translateY(-1px);
    }

    .btn-print {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .btn-print:hover {
      opacity: 0.88;
      transform: translateY(-2px);
    }

    select {
      padding: 9px 13px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:hover {
      border-color: rgba(59, 130, 246, 0.5);
    }

    select option {
      background: #1e293b;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .addr-box {
      width: calc(33.33% - 14px);
      min-width: 310px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 50px 16px 16px;
      position: relative;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      transition: border-color 0.25s, box-shadow 0.25s;
      animation: fadeUp 0.3s ease both;
    }

    .addr-box:hover {
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.12);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .box-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }

    .kdo-btn {
      font-family: 'Dancing Script', cursive;
      font-size: 17px;
      color: #c4b5fd;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .kdo-btn:hover {
      background: rgba(139, 92, 246, 0.2);
    }

    .box-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .lock-btn {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lock-btn:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .del-btn {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(100, 116, 139, 0.4);
      background: rgba(100, 116, 139, 0.1);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .del-btn:hover {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* CLEAR PROMINENT UNIQUE CODE BAR */
    .box-code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    .code-label-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .code-title {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .box-unique-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.8px;
      user-select: all;
    }

    .regen-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s;
    }

    .regen-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      border-color: rgba(56, 189, 248, 0.7);
      color: white;
    }

    .editable {
      width: 100%;
      min-height: 110px;
      max-height: 300px;
      overflow-y: auto;
      word-wrap: break-word;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 11px;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      background: rgba(255, 255, 255, 0.93);
      color: #111;
      line-height: 1.65;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .editable:focus {
      border-color: rgba(59, 130, 246, 0.7);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .editable[contenteditable="false"] {
      background: #e2e8f0;
      color: #64748b;
    }

    .empty-state {
      width: 100%;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 3.5rem;
      margin-bottom: 14px;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px 12px 50px;
      }

      .addr-box {
        width: 100%;
      }

      .divider {
        display: none;
      }

      .btn {
        padding: 9px 11px;
        font-size: 13px;
      }

      select {
        font-size: 13px;
        padding: 8px 10px;
      }
    }
  </style>
</head>

  <script>
    /* ============================================================
       1. UNIQUE TRACKING ID GENERATOR
       Generates a clean, unique tracking code: TRK-YYMMDD-XXXX
    ============================================================ */
    function generateUniqueId() {
      var d = new Date();
      var yymmdd = d.getFullYear().toString().slice(-2) +
                   String(d.getMonth() + 1).padStart(2, '0') +
                   String(d.getDate()).padStart(2, '0');
      var rand = Math.random().toString(36).substring(2, 6).toUpperCase();
      var timeMs = Date.now().toString(36).slice(-2).toUpperCase();
      return 'TRK-' + yymmdd + '-' + rand + timeMs;
    }

    /* ============================================================
       2. 100% SYNCHRONOUS & RELIABLE QR CODE GENERATOR
       Generates PNG DataURL synchronously without timeouts
    ============================================================ */
    function generateQRDataUrl(text) {
      if (!text) return '';
      try {
        var tempDiv = document.createElement('div');
        new QRCode(tempDiv, {
          text: String(text).trim(),
          width: 256,
          height: 256,
          correctLevel: QRCode.CorrectLevel.M
        });
        var canvas = tempDiv.querySelector('canvas');
        if (canvas) return canvas.toDataURL('image/png');
        var img = tempDiv.querySelector('img');
        if (img && img.src) return img.src;
      } catch (e) {
        console.error('QR Generation Error:', e);
      }
      return '';
    }

    /* ============================================================
       BUILD QR PAYLOAD: Customer Name (1st line), Phone, Pincode & Unique ID
    ============================================================ */
    function buildQRPayload(plainText, uniqueId) {
      if (!plainText || plainText === '[Empty Address Card]') {
        return uniqueId || '';
      }

      // 1. Extract phone number (Indian mobile)
      var phoneMatch = plainText.match(/(?:(?:\+|00)?91[\s-]?)?(?:0[\s-]?)?\b([6-9]\d{4}[\s-]?\d{5}|[6-9]\d{9}|\d{10})\b/);
      var phone = phoneMatch ? phoneMatch[1].replace(/\D/g, '').slice(-10) : '';

      // 2. Extract 6-digit pincode
      var pinMatch = plainText.match(/\b([1-9]\d{5})\b/);
      var pincode = pinMatch ? pinMatch[1] : '';

      // 3. Extract first non-empty line as customer name
      var name = '';
      var lines = plainText.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim();
        if (l) {
          name = l;
          break;
        }
      }

      // 4. Combine: Customer Name + Phone + Pincode + Unique Tracking ID
      var parts = [];
      if (name) parts.push(name);
      if (phone) parts.push(phone);
      if (pincode) parts.push(pincode);
      if (uniqueId) parts.push(uniqueId);

      return parts.join(' ').trim() || uniqueId || '';
    }

    /* ============================================================
       3. ADD ADDRESS BOX (Displays Unique Code clearly on each card)
    ============================================================ */
    function addBox() {
      var es = document.getElementById('emptyState');
      if (es) es.remove();
      var grid = document.getElementById('grid');
      var box = document.createElement('div');
      box.className = 'addr-box';
      
      var uid = generateUniqueId();

      box.innerHTML =
        '<div class="box-topbar">' +
          '<button class="kdo-btn" onclick="toggleKdo(this)">KDO</button>' +
          '<div class="box-actions">' +
            '<button class="lock-btn" onclick="toggleLock(this)">Lock</button>' +
            '<button class="del-btn"  onclick="removeBox(this)">X</button>' +
          '</div>' +
        '</div>' +
        '<div class="box-code-bar">' +
          '<div class="code-label-group">' +
            '<span class="code-title">&#128230; Tracking ID:</span>' +
            '<strong class="box-unique-code">' + uid + '</strong>' +
          '</div>' +
          '<button class="regen-btn" onclick="regenBoxId(this)" title="Generate new unique ID">&#8635; New ID</button>' +
        '</div>' +
        '<div class="editable" contenteditable="true" style="font-size:16px;font-family:Poppins,sans-serif;" placeholder="Paste recipient address here..."></div>';

      grid.appendChild(box);
      box.querySelector('.editable').focus();
    }

    // Refresh unique ID manually on any individual box
    function regenBoxId(btn) {
      var codeElem = btn.closest('.addr-box').querySelector('.box-unique-code');
      if (codeElem) {
        codeElem.textContent = generateUniqueId();
      }
    }

    function removeBox(btn) {
      var box = btn.closest('.addr-box');
      box.style.transition = 'all 0.18s';
      box.style.opacity = '0';
      box.style.transform = 'scale(0.93)';
      setTimeout(function () {
        box.remove();
        if (!document.querySelector('.addr-box')) {
          document.getElementById('grid').innerHTML =
            '<div class="empty-state" id="emptyState"><div class="icon">&#128221;</div>' +
            '<p>Click <strong>Add Box</strong> to create your first address card</p></div>';
        }
      }, 180);
    }

    function toggleLock(btn) {
      var ed = btn.closest('.addr-box').querySelector('.editable');
      var locked = ed.contentEditable === 'false';
      ed.contentEditable = locked ? 'true' : 'false';
      btn.textContent = locked ? 'Lock' : 'Unlock';
    }

    function toggleKdo(btn) {
      btn.textContent = btn.textContent.trim() === 'KDO' ? 'KZO' : 'KDO';
    }

    function applyFont() {
      var font = document.getElementById('fontFamily').value;
      document.querySelectorAll('.editable').forEach(function (el) {
        el.style.fontFamily = font;
      });
    }

    function alignAll(dir) {
      document.querySelectorAll('.editable').forEach(function (el) {
        el.style.textAlign = dir;
      });
    }

    function changeFontSize(delta) {
      document.querySelectorAll('.editable').forEach(function (el) {
        var cur = parseInt(window.getComputedStyle(el).fontSize);
        var next = cur + delta;
        if (next >= 10 && next <= 60) el.style.fontSize = next + 'px';
      });
    }

    /* ============================================================
       4. PRINT FUNCTION (Keeps Modern Clean Address Format)
       - Clean high-contrast top bar with KDO badge on the right
       - Compartmentalized Destination & Verification Matrix
       - Integrated QR code with corner crosshairs
       - Fixed unboxing video disclaimer pinned to bottom container
    ============================================================ */
    function printAddresses() {
      var boxes = document.querySelectorAll('.addr-box');
      if (!boxes.length) {
        alert('Please click "Add Box" to add an address first.');
        return;
      }

      var fontFamily = document.getElementById('fontFamily').value;
      var pageSize = document.getElementById('pageSize').value;

      var pagesHtml = '';
      var hasValidCard = false;

      // Loop through all boxes
      for (var b = 0; b < boxes.length; b++) {
        var box = boxes[b];
        var editable = box.querySelector('.editable');
        var kdoBtn = box.querySelector('.kdo-btn');
        var codeElem = box.querySelector('.box-unique-code');
        
        var label = kdoBtn ? kdoBtn.textContent.trim() : 'KDO';
        var content = editable.innerHTML.trim();
        var plainText = editable.innerText.trim();
        var size = window.getComputedStyle(editable).fontSize;
        var align = window.getComputedStyle(editable).textAlign;

        if (!plainText) {
          content = '<span style="color:#aaa;">[Empty Address Card]</span>';
        }
        hasValidCard = true;

        // Use the Unique ID currently displayed on this box
        var currentId = codeElem ? codeElem.textContent.trim() : generateUniqueId();
        if (!currentId) currentId = generateUniqueId();

        // Generate QR code containing customer address data + unique tracking ID
        var qrText = buildQRPayload(plainText, currentId);
        var qrDataUrl = generateQRDataUrl(qrText);

        // Calculate printable page height for pageSize
        var pageH = '277mm';
        var qrImgSize = 112;
        if (pageSize.toLowerCase() === 'a5') { pageH = '190mm'; qrImgSize = 104; }
        if (pageSize.toLowerCase() === 'a6') { pageH = '128mm'; qrImgSize = 92; }

        // Build Printable Page with Clean Structured Address Format
        pagesHtml +=
          '<div class="page">' +
            '<!-- TOP BAR WITH KDO BADGE -->' +
            '<div class="tech-header">' +
              '<div class="kdo-capsule">' + label + '</div>' +
            '</div>' +

            '<!-- MAIN BODY SPLIT -->' +
            '<div class="body-row">' +
              '<!-- RECIPIENT COMPARTMENT -->' +
              '<div class="dest-col">' +
                '<div class="dest-title">&#9660; SHIP TO // RECIPIENT DETAILS:</div>' +
                '<div class="content" style="font-size:' + size + ';text-align:' + align + '">' + content + '</div>' +
              '</div>' +

              '<!-- QR & TRACKING MATRIX -->' +
              '<div class="qr-col">' +
                '<div class="qr-crosshair-wrap">' +
                  '<div class="ch-tl"></div><div class="ch-tr"></div>' +
                  '<div class="ch-bl"></div><div class="ch-br"></div>' +
                  (qrDataUrl ? '<img class="qr-code-img" src="' + qrDataUrl + '" width="' + qrImgSize + '" height="' + qrImgSize + '" alt="QR"/>' : '') +
                '</div>' +
                '<div class="tracking-pill">' + currentId + '</div>' +
                '<div class="scan-tag">SCAN TO VERIFY</div>' +
              '</div>' +
            '</div>' +

            '<!-- PINNED FOOTER DISCLAIMER -->' +
            '<div class="note">' +
              '<span class="note-alert">&#9888;&#65039; Important : Unboxing video required for any claim.</span>' +
            '</div>' +
          '</div>';

        // AFTER assigning this ID to print, assign a FRESH new ID on screen for the next click!
        if (codeElem) {
          codeElem.textContent = generateUniqueId();
        }
      }

      if (!hasValidCard) return;

      // Complete print HTML document with High-Tech Monochrome Print Styling
      var fullHtml =
        '<!DOCTYPE html><html><head><title>Print ' + pageSize + '</title>' +
        '<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">' +
        '<style>' +
          '@page { size: ' + pageSize + ' portrait; margin: 8mm; }' +
          'html, body { height: 100%; margin: 0; padding: 0; font-family: ' + fontFamily + ', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff; color: #000; }' +
          '.page { width: 100%; height: ' + pageH + '; min-height: ' + pageH + '; box-sizing: border-box; padding: 12px; position: relative; page-break-after: always; page-break-inside: avoid; display: flex; flex-direction: column; justify-content: space-between; border: 2.5px solid #000; background: #fff; }' +
          '.page:last-child { page-break-after: avoid; }' +
          
          '/* TOP BAR */' +
          '.tech-header { display: flex; justify-content: flex-end; align-items: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; flex-shrink: 0; }' +
          '.kdo-capsule { font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 800; background: #000; color: #fff; padding: 3px 12px; border-radius: 4px; letter-spacing: 1px; }' +

          '/* BODY & RECIPIENT */' +
          '.body-row { display: flex; justify-content: space-between; align-items: stretch; flex: 1 1 auto; gap: 14px; overflow: hidden; padding: 4px 0; }' +
          '.dest-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }' +
          '.dest-title { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 800; border-bottom: 1.5px solid #000; padding-bottom: 4px; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }' +
          '.content { flex: 1; word-wrap: break-word; line-height: 1.48; overflow: hidden; }' +

          '/* QR & CROSSHAIR BOX */' +
          '.qr-col { width: 120px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border-left: 1.5px dashed #555; padding-left: 12px; }' +
          '.qr-crosshair-wrap { position: relative; padding: 6px; display: inline-block; }' +
          '.qr-code-img { display: block; background: #fff; }' +
          '.ch-tl { position: absolute; top: 0; left: 0; width: 8px; height: 8px; border-top: 2px solid #000; border-left: 2px solid #000; }' +
          '.ch-tr { position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-top: 2px solid #000; border-right: 2px solid #000; }' +
          '.ch-bl { position: absolute; bottom: 0; left: 0; width: 8px; height: 8px; border-bottom: 2px solid #000; border-left: 2px solid #000; }' +
          '.ch-br { position: absolute; bottom: 0; right: 0; width: 8px; height: 8px; border-bottom: 2px solid #000; border-right: 2px solid #000; }' +
          '.tracking-pill { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 800; border: 1.5px solid #000; padding: 2px 5px; margin-top: 6px; text-align: center; letter-spacing: 0.5px; border-radius: 3px; background: #f4f4f5; width: 100%; box-sizing: border-box; }' +
          '.scan-tag { font-family: "JetBrains Mono", monospace; font-size: 7.5px; font-weight: 700; color: #444; margin-top: 3px; letter-spacing: 0.5px; text-align: center; }' +

          '/* FOOTER SECURITY NOTE */' +
          '.note { margin-top: auto; padding-top: 8px; padding-bottom: 2px; width: 100%; text-align: center; flex-shrink: 0; border-top: 2px solid #000; }' +
          '.note-alert { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 800; color: #000; letter-spacing: 0.3px; }' +
        '</style>' +
        '</head><body>' +
        pagesHtml +
        '</body></html>';

      // Hidden iframe for 100% reliable printing without popup blocking
      var frame = document.getElementById('print_frame');
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'print_frame';
        frame.style.position = 'fixed';
        frame.style.right = '0';
        frame.style.bottom = '0';
        frame.style.width = '0';
        frame.style.height = '0';
        frame.style.border = '0';
        document.body.appendChild(frame);
      }

      var frameDoc = frame.contentWindow.document;
      frameDoc.open();
      frameDoc.write(fullHtml);
      frameDoc.close();

      setTimeout(function() {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }, 350);
    }

    /* ============================================================
       5. PDF DOWNLOAD
    ============================================================ */
    function generatePDF() {
      var boxes = document.querySelectorAll('.addr-box');
      if (!boxes.length) {
        alert('Please add an address first.');
        return;
      }

      var jsPDFLib = window.jspdf;
      var pageSize = document.getElementById('pageSize').value.toLowerCase();
      var doc = new jsPDFLib.jsPDF({ format: pageSize });

      var colWidth = 180, maxH = 270, qrSz = 35, qrX = 160;
      if (pageSize === 'a5') { colWidth = 100; maxH = 190; qrSz = 30; qrX = 110; }
      if (pageSize === 'a6') { colWidth = 65; maxH = 130; qrSz = 25; qrX = 75; }

      var y = 10;
      var hasPage = false;

      for (var b = 0; b < boxes.length; b++) {
        var box = boxes[b];
        var editable = box.querySelector('.editable');
        var codeElem = box.querySelector('.box-unique-code');
        var text = editable ? editable.innerText.trim() : '';
        if (!text) text = '[Empty Address Card]';

        var currentId = codeElem ? codeElem.textContent.trim() : generateUniqueId();
        if (!currentId) currentId = generateUniqueId();

        var qrText = buildQRPayload(text, currentId);
        var qrUrl = generateQRDataUrl(qrText);

        var lines = doc.splitTextToSize(text, colWidth);
        var blockH = Math.max(lines.length * 6, qrSz) + 20;

        if (y + blockH > maxH && hasPage) {
          doc.addPage();
          y = 10;
        }

        doc.setFontSize(11);
        doc.text(lines, 10, y + 5);

        if (qrUrl) {
          doc.addImage(qrUrl, 'PNG', qrX, y, qrSz, qrSz);
          doc.setFontSize(8);
          doc.text(currentId, qrX, y + qrSz + 4);
        }

        y += blockH;
        hasPage = true;

        if (codeElem) {
          codeElem.textContent = generateUniqueId();
        }
      }

      doc.save('shipping_labels.pdf');
    }

    // Start with one box
    addBox();
  </script>
</body>

</html>
